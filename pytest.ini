# pytest configuration — lets `pytest` run from the project root with no flags.
[pytest]
testpaths = tests
# Put the project root on sys.path so tests can `import config` and `from src...`
# exactly like app.py does — no sys.path hacks inside test files.
pythonpath = .
# ROS 2, when sourced in ~/.bashrc, exports PYTHONPATH=/opt/ros/..., which
# exposes ROS's pytest plugins to EVERY Python, this venv included. They crash
# on import (missing 'lark') and abort the run. Block them by name; on a
# machine without ROS these flags are a harmless no-op.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_pep257 -p no:ament_flake8
          -p no:ament_lint -p no:ament_copyright -p no:ament_xmllint
markers =
    model: loads a real transformer model (downloaded once, ~100-300 MB). Fast run: pytest -m "not model"
filterwarnings =
    # Third-party deprecation noise (transformers/chromadb internals), not our code.
    ignore::DeprecationWarning
    ignore::FutureWarning
